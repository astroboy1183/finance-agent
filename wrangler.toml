name = "finance-agent"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# D1 ledger — bound as env.DB
[[d1_databases]]
binding = "DB"
database_name = "finance"
database_id = "13cde827-f91c-4086-9158-1bfbc6ea5604"

# One every-minute cron (Cloudflare free tier caps the account at 5 total; one
# minute is the finest granularity Cloudflare cron allows — there is no
# per-second trigger). Each run ingests new emails, so a transaction surfaces
# within ~a minute; the 06:05 IST run additionally fires the morning report,
# plus the weekly review on Sundays and the monthly report on the 1st. Dedupe
# guards in scheduled() ensure each briefing sends once per period. For an
# instant update, the dashboard "Refresh" button triggers an on-demand scan.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
